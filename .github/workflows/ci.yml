name: CI

on:
  push:
    branches: [main]
    # A release is a tag. Publishing hangs off this, so the whole suite runs
    # before anything reaches the registry.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Two commits in quick succession would otherwise run two publish jobs writing
# the same edge tag at once: both spend registry quota, one of them for a
# result that is immediately superseded. GitHub answers that burst with a
# secondary rate limit, and the push fails.
#
# A tag is never cancelled. An interrupted release publishes nothing, and the
# tag would have to be cut again to retry.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CGO_ENABLED: "0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      # Through the Justfile, which is where the race detector's cgo
      # requirement is dealt with: the CGO_ENABLED=0 above would otherwise
      # make the Go toolchain refuse -race.
      - name: Test with race detector
        run: just race

      # The download coalescer is the critical section of the whole project.
      # Repeat it to shake out scheduling-dependent races.
      - name: Stress the coalescer
        run: just stress

      - name: Verify third-party notices are up to date
        run: just notices-check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      # Exercises the blobstore contract against a real S3 implementation.
      # The in-memory double cannot tell us whether conditional GETs,
      # path-style addressing or listing pagination actually work.
      - name: Integration tests against MinIO
        run: just test-integration

  # Proves the Dockerfile still builds for both architectures. Only pull
  # requests need this: a push goes on to publish, which builds the same thing
  # and would do it twice.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image for linux/amd64 and linux/arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ github.sha }}
            VCS_REF=${{ github.sha }}

  # Publishes to ghcr.io/nledez/aquifer. It waits for every other job, because
  # an image nobody has tested is worse than no image: an operator pulling a
  # tag has no way to know the suite was red.
  #
  # A tag publishes its version plus latest; a commit on main publishes edge,
  # which is what the deployment guides mean by "not a release".
  publish:
    if: github.event_name == 'push'
    needs: [test, integration, apt, lint, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The one privilege the default token does not carry. It is the runner's
      # own GITHUB_TOKEN, so there is no secret to create or rotate.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Derive the tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # {{version}} strips the tag's leading v, so v0.1.0 publishes 0.1.0 -
          # the form the deployment guides and the compose file reference.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable={{is_default_branch}}

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}

  apt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      # The only test that proves the whole system works: a real signed Debian
      # repository, published, served by an edge, installed by a real apt, for
      # every configured suite and architecture.
      - name: apt integration test
        run: just test-apt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Must be built with a Go at least as new as go.mod targets, or it
          # refuses the module outright instead of linting it.
          version: v2.12.2

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The release attaches darwin binaries, so darwin has to compile here.
        # Compiling is all this proves: nothing runs the suite on darwin.
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags='-s -w' -o /dev/null ./cmd/...

  # Creates the GitHub Release for a tag: the four binaries, their checksums,
  # and the changelog section `just release` wrote. It waits for publish, so a
  # release never points at an image that is not in the registry yet.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Each archive carries the licences with the binary, which BSD-3-Clause
      # and Apache-2.0 section 4 both require of a binary distribution.
      - name: Build the release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            stage="dist/aquifer_${version}_${os}_${arch}"
            mkdir -p "$stage"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/nledez/aquifer/internal/cli.version=${version}" \
              -o "$stage/aquifer" ./cmd/aquifer
            cp LICENSE THIRD-PARTY-NOTICES.txt "$stage/"
            tar -C dist -czf "${stage}.tar.gz" "$(basename "$stage")"
            rm -rf "$stage"
          done
          cd dist && sha256sum ./*.tar.gz > SHA256SUMS && cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          notes=$(mktemp)
          # The section just release wrote, verbatim. Anything else would be a
          # second, divergent account of the same change.
          awk -v want="## ${version} " '
            $0 ~ "^" want { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$notes"

          # A tag cut by hand has no section. Let GitHub write the notes rather
          # than publish an empty body.
          generated=()
          [ -s "$notes" ] || generated=(--generate-notes)

          {
            echo
            echo "## Container image"
            echo
            echo '```sh'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY}:${version}"
            echo '```'
          } >> "$notes"

          gh release create "$VERSION" dist/*.tar.gz dist/SHA256SUMS \
            --title "aquifer ${version}" --notes-file "$notes" "${generated[@]+"${generated[@]}"}"
