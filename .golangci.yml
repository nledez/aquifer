version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    # err113 is deliberately absent. An error gets a package-level sentinel
    # when a caller matches it - blobstore.ErrNotFound, fetch.ErrChecksumMismatch,
    # manifest.ErrUnsupportedVersion - and stays inline when it only ever
    # reaches a human. err113 rejects that second case wholesale, which would
    # mean seventy exported names nobody compares against.
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
        - name: context-as-argument
        - name: error-strings
        - name: indent-error-flow
        - name: var-naming

  exclusions:
    rules:
      # Test helpers legitimately build ad-hoc errors and skip some checks.
      # bodyclose is here for a different reason: the harness closes every
      # response body through t.Cleanup, and the linter cannot see through
      # that indirection to the call sites.
      - path: _test\.go$
        linters:
          - bodyclose
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nledez/aquifer

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
