# A complete local Aquifer: MinIO standing in for the object store, and one
# edge in front of it.
#
#   docker compose -f deploy/docker-compose.yml up -d
#   aquifer publish --repo debian/bookworm /path/to/aptly/public/bookworm
#   curl -I http://127.0.0.1:8080/debian/bookworm/dists/bookworm/InRelease
#
# publish runs from the host against 127.0.0.1:9000; the edge reaches MinIO by
# service name on the compose network.

name: aquifer

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: aquifer
      MINIO_ROOT_PASSWORD: aquifer-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket once, then exits.
  minio-init:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 aquifer aquifer-secret
        mc mb --ignore-existing local/aquifer
    restart: "no"

  edge:
    image: ghcr.io/nledez/aquifer:0.1.0
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command: ["serve", "--config", "/etc/aquifer/config.yaml"]
    environment:
      AQUIFER_S3_ACCESS_KEY: aquifer
      AQUIFER_S3_SECRET_KEY: aquifer-secret
      # The admin port binds to loopback by default, which is unreachable from
      # outside the container. Expose it here so Prometheus can scrape it.
      AQUIFER_ADMIN_LISTEN: "0.0.0.0:8081"
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./aquifer.yaml:/etc/aquifer/config.yaml:ro
      - edge-cache:/var/cache/aquifer
    # SPEC section 11: the root filesystem is read-only and only the cache is
    # writable. The binary needs nothing else.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  minio-data:
  edge-cache:
